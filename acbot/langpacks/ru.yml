# AuthorBot public pages and onboarding · © AuthorChe
$public_pages:
  start_label: Добро пожаловать в AuthorBot
  help_label: Команды и первые шаги
  about_label: Знакомство с AuthorBot
  author_label: Об AuthorChe
  projects_label: Проекты AuthorChe
  install: Установить AuthorBot
  welcome_title: ✦ Твой Telegram. Твои возможности.
  start_intro: 'Добро пожаловать в <b>AuthorBot</b> — модульный Telegram userbot от <b>AuthorChe</b>. Преврати повседневные действия в инструменты, которые работают по твоим правилам: автоматизация, модули и удобный интерфейс прямо в Telegram.'
  welcome_intro: <b>AuthorBot готов к работе.</b> Твоё личное пространство инструментов в Telegram уже запущено. Изучай встроенные возможности, выбирай язык и добавляй нужные модули. Начни с малого — и сделай его своим.
  possibilities: ✦ Создан для твоего ритма
  feature_modules: <b>Модули</b> — добавляй возможности и настраивай каждый инструмент отдельно.
  feature_inline: <b>Inline-инструменты</b> — кнопки, формы, списки и галереи внутри Telegram.
  feature_rich: <b>Rich Messages</b> — выразительные страницы с медиа, таблицами и интерактивными кнопками.
  feature_control: <b>Твои настройки</b> — язык, разрешения, резервные копии и обновления под твоим контролем.
  explore: ✦ Открой для себя AuthorBot
  first_steps: ✦ Несколько команд для начала
  step_help: Посмотреть установленные модули и команды.
  step_module: Прочитать справку о модуле или команде.
  step_install: Установить модуль по ссылке на его код.
  step_file: Ответить на Python-файл модуля, чтобы установить его.
  step_language: Выбрать язык интерфейса.
  step_info: Посмотреть версию и состояние своего userbot.
  choose_language: Выбери язык кнопками ниже. Изменить его позже можно командой setlang.
  help_intro: Этот бот — публичный интерфейс установленного AuthorBot. Страницы ниже доступны всем; команды userbot запускаются с Telegram-аккаунта владельца.
  help_note: Модули могут добавлять свои команды и inline-инструменты. Их доступность зависит от установленных модулей и разрешений владельца. В примерах используется стандартный префикс «точка»; если ты изменил его, используй свой.
  about_tagline: ✦ Личный набор инструментов в Telegram
  about_intro: <b>AuthorBot переносит автоматизацию туда, где ты уже общаешься.</b> Он работает с твоим Telegram-аккаунтом и объединяет модульное ядро с ботом для интерактивных инструментов. Повседневные команды, работа с медиа и собственные идеи собираются в одном пространстве, которое можно настроить под себя.
  about_workflow: Найди нужный инструмент, установи его модуль и подстрой настройки под свой ритм. Открой форму вместо запоминания всех параметров, посмотри галерею или опубликуй rich-страницу. Оставляй то, чем пользуешься, и расширяй userbot вместе со своими потребностями.
  about_modules_title: 🧩 Модульное ядро
  about_modules: Устанавливай, настраивай и удаляй модули без переписывания ядра. Создавай собственные Python-модули для AuthorBot.
  about_inline_title: 🎛 Интерактивный интерфейс
  about_inline: Формы, кнопки, списки и галереи превращают команды в удобные элементы управления в Telegram.
  about_rich_title: ✦ Rich Messages
  about_rich: Структурированные страницы с медиа, центрированными блоками заголовков, таблицами, раскрываемыми секциями и rich-кнопками.
  about_security_title: 🔐 Управление доступом
  about_security: Определяй, кто может выполнять команды, с помощью прав владельца и адресных правил безопасности.
  about_backup_title: 💾 Сохранение работы
  about_backup: Встроенные резервные копии, постоянные настройки и самообновление помогают поддерживать твоё рабочее пространство.
  about_language_title: 🌍 Языки
  about_language: Украинский, английский, русский, немецкий и японский; для непереведённых строк модулей используется английский.
  about_setup_title: Где работает AuthorBot
  about_setup: На Linux-сервере, в Docker или на Android через Termux. Автоматизированный Termux-установщик готовит Debian и Python, проверяет библиотеки и сохраняет подробности установки в журнале.
  about_vision: 'Инструмент, который растёт вместе с тобой: от полезной команды до собственного сценария работы в Telegram.'
  author_hint: Познакомься с человеком, который создаёт проект, командой <code>/author</code>.
  author_tagline: Разработчик · музыкант · автор
  author_intro: '<b>AuthorChe</b> — творческий и технический бренд украинского разработчика <b>Вадима Емельянова</b>: музыканта, певца, композитора, поэта и автора цифровых проектов.'
  author_vision: Музыка, слово и код — разные способы воплотить идею. Технические проекты AuthorChe объединяют Telegram, Android, автоматизацию, приватность и AI-инструменты — с вниманием к возможностям продукта и ощущениям от его использования.
  author_world: ✦ Один автор. Разные способы творить.
  author_projects: AuthorBot, AuthorGram, Jarvis | AuthorAi, Goose | AuthorBrowser и Author AI воплощают эти интересы в цифровых инструментах. Открой <code>/projects</code>, чтобы познакомиться с ними, или следи за официальным сайтом и Telegram-каналом.
  projects_intro: Цифровые проекты <b>AuthorChe</b>. Официальный сайт и Telegram-канал объединяют новости, релизы и эксперименты.
  project_gram: <b>AuthorGram</b> — Telegram-клиент для Android с упором на приватность, настройки интерфейса и мультимедиа.
  project_bot: <b>AuthorBot</b> — модульный Telegram userbot с автоматизацией, inline-инструментами, управлением доступом, резервными копиями и Rich Messages.
  project_ai: <b>Jarvis | AuthorAi</b> — Android AI-agent с локальными GGUF-моделями, голосовыми режимами, инструментами, файлами и офлайн-знаниями.
  project_browser: <b>Goose | AuthorBrowser</b> — Android-браузер с медиа-инструментами, блокировкой рекламы, фоновым воспроизведением и интеграциями.
  project_platform: <b>Author AI</b> — серверная AI-платформа и интеграции для агентов, инструментов и автоматизации.
  ready: ✅ Inline-интерфейс AuthorBot готов к работе.
