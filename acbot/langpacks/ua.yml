# AuthorBot public pages and onboarding · © AuthorChe
$public_pages:
  start_label: Вітаємо в AuthorBot
  help_label: Команди та перші кроки
  about_label: Знайомство з AuthorBot
  author_label: Про AuthorChe
  projects_label: Проєкти AuthorChe
  install: Встановити AuthorBot
  welcome_title: ✦ Твій Telegram. Твої можливості.
  start_intro: 'Вітаємо в <b>AuthorBot</b> — модульному Telegram userbot від <b>AuthorChe</b>. Перетвори щоденні дії на інструменти, які працюють за твоїми правилами: автоматизація, модулі та зручний інтерфейс просто в Telegram.'
  welcome_intro: <b>AuthorBot готовий до роботи.</b> Твій особистий простір інструментів у Telegram уже запущено. Знайомся з вбудованими можливостями, обирай мову та додавай потрібні модулі. Почни з малого — і зроби його своїм.
  possibilities: ✦ Створений для твого ритму
  feature_modules: <b>Модулі</b> — додавай можливості та налаштовуй кожен інструмент окремо.
  feature_inline: <b>Inline-інструменти</b> — кнопки, форми, списки й галереї всередині Telegram.
  feature_rich: <b>Rich Messages</b> — виразні сторінки з медіа, таблицями та інтерактивними кнопками.
  feature_control: <b>Твої налаштування</b> — мова, дозволи, резервні копії та оновлення під твоїм контролем.
  explore: ✦ Відкрий для себе AuthorBot
  first_steps: ✦ Кілька команд для початку
  step_help: Переглянути встановлені модулі й команди.
  step_module: Прочитати довідку про модуль або команду.
  step_install: Встановити модуль за посиланням на його код.
  step_file: Відповісти на Python-файл модуля, щоб встановити його.
  step_language: Обрати мову інтерфейсу.
  step_info: Переглянути версію та стан свого userbot.
  choose_language: Обери мову кнопками нижче. Змінити її пізніше можна командою setlang.
  help_intro: Цей бот — публічний інтерфейс встановленого AuthorBot. Сторінки нижче доступні всім; команди userbot запускаються з Telegram-акаунта власника.
  help_note: Модулі можуть додавати власні команди та inline-інструменти. Їхня доступність залежить від встановлених модулів і дозволів власника. У прикладах використано стандартний префікс «крапка»; якщо ти змінив його, використовуй свій.
  about_tagline: ✦ Особистий набір інструментів у Telegram
  about_intro: <b>AuthorBot переносить автоматизацію туди, де ти вже спілкуєшся.</b> Він працює з твоїм Telegram-акаунтом і поєднує модульне ядро з ботом для інтерактивних інструментів. Щоденні команди, робота з медіа та власні ідеї збираються в одному просторі, який можна налаштувати під себе.
  about_workflow: Знайди потрібний інструмент, встанови його модуль і пристосуй налаштування до свого ритму. Відкрий форму замість запам'ятовування всіх параметрів, переглянь галерею або опублікуй rich-сторінку. Залишай те, чим користуєшся, і розширюй userbot разом зі своїми потребами.
  about_modules_title: 🧩 Модульне ядро
  about_modules: Встановлюй, налаштовуй і видаляй модулі без переписування ядра. Створюй власні Python-модулі для AuthorBot.
  about_inline_title: 🎛 Інтерактивний інтерфейс
  about_inline: Форми, кнопки, списки й галереї перетворюють команди на зручні елементи керування в Telegram.
  about_rich_title: ✦ Rich Messages
  about_rich: Структуровані сторінки з медіа, центрованими блоками заголовків, таблицями, розгортаними секціями та rich-кнопками.
  about_security_title: 🔐 Керування доступом
  about_security: Визначай, хто може виконувати команди, за допомогою прав власника й адресних правил безпеки.
  about_backup_title: 💾 Збереження роботи
  about_backup: Вбудовані резервні копії, постійні налаштування та самооновлення допомагають підтримувати твій робочий простір.
  about_language_title: 🌍 Мови
  about_language: Українська, англійська, російська, німецька та японська; для неперекладених рядків модулів використовується англійська.
  about_setup_title: Де працює AuthorBot
  about_setup: На Linux-сервері, у Docker або на Android через Termux. Автоматизований Termux-інсталятор готує Debian і Python, перевіряє бібліотеки та зберігає подробиці встановлення в журналі.
  about_vision: 'Інструмент, який росте разом із тобою: від корисної команди до власного сценарію роботи в Telegram.'
  author_hint: Познайомся з людиною, яка створює проєкт, командою <code>/author</code>.
  author_tagline: Розробник · музикант · автор
  author_intro: '<b>AuthorChe</b> — творчий і технічний бренд українського розробника <b>Вадима Ємельянова</b>: музиканта, співака, композитора, поета та автора цифрових проєктів.'
  author_vision: Музика, слово й код — різні способи втілити ідею. Технічні проєкти AuthorChe поєднують Telegram, Android, автоматизацію, приватність та AI-інструменти — з увагою до можливостей продукту й відчуття від користування ним.
  author_world: ✦ Один автор. Різні способи творити.
  author_projects: AuthorBot, AuthorGram, Jarvis | AuthorAi, Goose | AuthorBrowser та Author AI втілюють ці інтереси в цифрових інструментах. Відкрий <code>/projects</code>, щоб познайомитися з ними, або стеж за офіційним сайтом і Telegram-каналом.
  projects_intro: Цифрові проєкти <b>AuthorChe</b>. Офіційний сайт і Telegram-канал об'єднують новини, релізи та експерименти.
  project_gram: <b>AuthorGram</b> — Telegram-клієнт для Android із фокусом на приватність, налаштування інтерфейсу й мультимедіа.
  project_bot: <b>AuthorBot</b> — модульний Telegram userbot з автоматизацією, inline-інструментами, керуванням доступом, резервними копіями та Rich Messages.
  project_ai: <b>Jarvis | AuthorAi</b> — Android AI-agent із локальними GGUF-моделями, голосовими режимами, інструментами, файлами й офлайн-знаннями.
  project_browser: <b>Goose | AuthorBrowser</b> — Android-браузер із медіа-інструментами, блокуванням реклами, фоновим відтворенням та інтеграціями.
  project_platform: <b>Author AI</b> — серверна AI-платформа та інтеграції для агентів, інструментів і автоматизації.
  ready: ✅ Inline-інтерфейс AuthorBot готовий до роботи.
  sent_author: ✅ Сторінка AuthorChe — у твоєму приватному чаті з inline-ботом.
