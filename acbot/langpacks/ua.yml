  db_restored: "<emoji document_id=5774134533590880843>🔄</emoji> <b>Базу даних оновлено, перезавантаження...</b>"
  modules_backup: "<emoji document_id=5431736674147114227>🗂</emoji> <b>Бекап модулів ({})</b>\n\n<b>Ви можете відновити його використовуючи:</b>\n<pre><code class=\"language-acbot\">{}restoremods</code></pre>"
