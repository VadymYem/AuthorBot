  installation: "<emoji document_id=5363805650327450240>▪️</emoji> The installation is very easy! Just enter the following in your servers terminal:\n<pre><code class=\"language-bash\">sudo apt update &amp;&amp; sudo apt upgrade -y &amp;&amp; sudo apt install git &amp;&amp; sudo apt install python3-pip &amp;&amp; git clone https://github.com/VadymYem/AuthorBot && cd AuthorBot && pip install -r requirements.txt &amp;&amp; python3 -m acbot</code></pre> <emoji document_id=5299027123913105700>\U0001F610</emoji> If you dont have sudo access, simply remove the initial steps.\n<emoji document_id=5300777464820145682>\U0001F973</emoji> Lets go over a few arguments:\n<emoji document_id=5787313834012184077>\U0001F510</emoji> The <code>--root</code> argument allows you to run as a <b>root user</b>.\n<emoji document_id=5785209342986817408>\U0001F30E</emoji> The <code>--no-web</code> argument enables login to your account <b>directly in the terminal, rather than through a link</b> <code>{}.lhr.life</code>.\nIt completely safe and will help you upgrade to AuthorBot automatically"
