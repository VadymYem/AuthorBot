  about_workflow: 必要なツールを見つけ、モジュールをインストールし、日常の使い方に合わせて設定しましょう。すべての引数を覚える代わりにフォームを開いたり、ギャラリーを閲覧したり、リッチなページを公開したりできます。使う機能を残し、必要に応じて環境を広げられます。
  about_modules_title: 🧩 モジュール型コア
