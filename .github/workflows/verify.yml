name: Verify AuthorBot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libffi-dev libjpeg-dev libwebp-dev

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run repository self-check
        run: python scripts/selfcheck.py

      - name: Import startup-critical modules
        run: |
          python -c "import acbot.translations"
          python -c "import acbot.inline.rich"
          python -c "import acbot.database"
          python -c "import acbot.modules.loader"

      - name: Startup argument smoke test
        run: python -m acbot --help >/dev/null

      - name: Verify Docker Compose config
        run: docker compose config --quiet
