name: Verify AuthorBot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
        dependencies: [core, full]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libffi-dev libjpeg-dev libwebp-dev

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run repository self-check
        run: python scripts/selfcheck.py

      - name: Check Termux installer control flow
        run: python scripts/termuxcheck.py

      - name: Install and verify optional dependencies
        if: matrix.dependencies == 'full'
        run: |
          python -m pip install -r optional_requirements.txt
          python -m pip check

      - name: Run offline runtime regression checks
        run: python scripts/runtimecheck.py

      - name: Import startup-critical modules
        run: |
          python -c "import acbot.translations"
          python -c "import acbot.inline.rich"
          python -c "import acbot.database"
          python -c "import acbot.modules.loader"

      - name: Startup argument smoke test
        run: python -m acbot --help >/dev/null

      - name: Verify Docker Compose config
        run: docker compose config --quiet

  docker-build:
    name: docker-build
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build production image
        run: docker build --tag authorbot-ci .

      - name: Verify startup with optional dependencies inside Docker
        run: docker run --rm authorbot-ci python -m acbot --help

  termux-runtime:
    name: Debian Bookworm runtime through PRoot (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install PRoot-Distro
        run: |
          sudo apt-get update
          sudo apt-get install -y proot
          python -m pip install proot-distro

      - name: Install the same Debian image used by Termux
        run: proot-distro install debian:bookworm --name authorbot

      - name: Verify Debian archive keyring
        run: |
          proot-distro login authorbot -- /bin/ls -l /usr/share/keyrings/debian-archive-keyring.gpg
          proot-distro login authorbot -- /usr/bin/apt-get -o APT::Sandbox::User=root -o Debug::Acquire::gpgv=true update

      - name: Verify guest dependencies and offline regression checks
        run: |
          proot-distro login --bind "$PWD:/opt/authorbot" authorbot -- /bin/bash /opt/authorbot/scripts/termux-runtime.sh install

      - name: Verify the guest startup command
        run: |
          proot-distro login --bind "$PWD:/opt/authorbot" authorbot -- /bin/bash /opt/authorbot/scripts/termux-runtime.sh run --help
